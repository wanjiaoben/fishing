name: Deploy PayPal Authorization production

on:
  push:
    tags:
      - "fishing-paypal-auth-v*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "Production tag must point at origin/main: tag=$tag_sha main=$main_sha" >&2
            exit 1
          fi
          tag_annotation="$(git cat-file -p "refs/tags/$GITHUB_REF_NAME")"
          if ! grep -q 'Wan-Verified: yes' <<< "$tag_annotation"; then
            echo 'Missing required Wan-Verified: yes annotation' >&2
            exit 1
          fi
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx wrangler d1 migrations apply fishing-paypal-auth --remote --config wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --config wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
